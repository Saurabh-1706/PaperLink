services:
  # MongoDB is NOT containerised: this project uses the MongoDB server installed on the
  # host (Windows service "MongoDB", port 27017). Containers reach it through
  # host.docker.internal; the extra_hosts entry makes that name resolve on Linux too,
  # where Docker Desktop does not provide it for free.
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.api
    env_file: ./backend/.env
    ports: ["8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: {condition: service_started}

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.worker
    env_file: ./backend/.env
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: {condition: service_started}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    environment:
      # Server-side only: the BFF route handlers in app/api/* call the API from
      # inside this container, where localhost is the container itself.
      - BACKEND_API_URL=http://api:8000
    depends_on:
      - api
