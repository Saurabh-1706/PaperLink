services:
  # MongoDB is NOT containerised: this project uses the MongoDB server installed on the
  # host (Windows service "MongoDB", port 27017). The container reaches it through
  # host.docker.internal; the extra_hosts entry makes that name resolve on Linux too,
  # where Docker Desktop does not provide it for free.

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: ./apps/web/.env.local
    ports: ["3000:3000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [app-network]

networks:
  app-network:
    driver: bridge
